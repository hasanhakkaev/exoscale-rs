[package]
name = "exoscale-rs"
version = "3.5.0"
authors = ["support@exoscale.com"]
description = "Infrastructure automation API, allowing programmatic access to all Exoscale products and services."
license = "MIT"
edition = "2021"
repository = "https://github.com/hasanhakkaev/exoscale-rs"
documentation = "https://docs.rs/exoscale-rs"
homepage = "https://github.com/hasanhakkaev/exoscale-rs"


[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_with = { version = "^3.23.0", default-features = false, features = ["base64", "std", "macros"] }
serde_json = "^1.0"
serde_repr = "^0.1"
base64 = "0.23.1"
hmac = "0.13.0"
http = "1.5.0"
sha2 = "0.11.0"
secrecy = "0.10.3"
bytes = "1.12.1"
async-trait = "0.1.92"
url = "^2.5"
libc = "0.2.189"
uuid = { version = "^1.26", features = ["serde", "v4"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "query"] }
reqwest-middleware = { version = "0.5.2", features = ["json", "multipart", "query"] }
